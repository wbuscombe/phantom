name: Phantom Capture (Reusable)

on:
  workflow_call:
    inputs:
      project-type:
        description: "Runner type: web, tui, desktop, or docker-compose"
        required: true
        type: string
      phantom-version:
        description: >-
          Phantom version to install. One of: a PyPI version constraint on release
          numbers, using ==, !=, ~=, <=, >=, < or >, comma-separated, no spaces, with
          '.*' only after == or != (e.g. '>=0.4,<0.5', '==0.4.*'); an exact version
          N.N.N, installed as ==N.N.N (e.g. '0.2.0'); or a git ref made of A-Z a-z 0-9
          . _ / - with no leading '-', no leading, trailing or repeated '/', and no
          '..' (e.g. 'main', 'feature/x'). Any other value, including an empty one,
          fails the step before anything is installed.
        required: false
        default: ">=0.4,<0.5"
        type: string
      publish-strategy:
        description: "How to publish screenshots: direct, pr, or artifacts-only"
        required: false
        default: "pr"
        type: string
      rust-cache:
        description: "Cache Rust/silicon binaries for TUI runner"
        required: false
        default: true
        type: boolean
      ai-analyst:
        description: "Use AI to generate capture plan from codebase analysis"
        required: false
        default: false
        type: boolean
      ai-document:
        description: "Use AI to write documentation around screenshots"
        required: false
        default: false
        type: boolean
      ai-auto:
        description: "Full autonomous pipeline (analyze + capture + document)"
        required: false
        default: false
        type: boolean
      upload-screenshots-artifact:
        description: "Upload captured screenshots as a workflow artifact (debug only; OFF by default to avoid exposing frames before review)"
        required: false
        default: false
        type: boolean
      force-publish:
        description: "Publish screenshots even if a capture fails an error-severity quality check (bypasses the CI quality gate via phantom --force)"
        required: false
        default: false
        type: boolean
    secrets:
      github-token:
        description: "GitHub token for pushing/PRs"
        required: true
      anthropic-key:
        description: "Anthropic API key for AI features"
        required: false

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install Phantom
        # Caller inputs reach this script only through env. Interpolating them
        # into the script text with an expression would let a crafted value run
        # as shell code on the runner.
        env:
          PHANTOM_VERSION: ${{ inputs.phantom-version }}
          AI_ANALYST: ${{ inputs.ai-analyst }}
          AI_DOCUMENT: ${{ inputs.ai-document }}
          AI_AUTO: ${{ inputs.ai-auto }}
        run: |
          AI_EXTRA=""
          if [[ "$AI_ANALYST" == "true" || "$AI_DOCUMENT" == "true" || "$AI_AUTO" == "true" ]]; then
            AI_EXTRA="[ai]"
          fi
          reject() {
            echo "::error title=Invalid phantom-version::$1 Accepted forms: a version specifier such as '>=0.4,<0.5' or '==0.4.*', an exact version such as '0.2.0', or a git ref such as 'main'. Nothing was installed."
            exit 1
          }
          # Validate phantom-version before any install target is built. The
          # first rule that applies fixes the category (the same order the
          # workflow has always used), and a value that fails its category's
          # full pattern is rejected, never re-routed to another category:
          #   1. contains <, > or =  -> version specifier, appended as-is
          #   2. starts with N.N.N   -> exact version, installed as ==N.N.N
          #   3. anything else       -> git ref
          # Character sets are spelled out rather than written as ranges so the
          # match cannot depend on the runner's locale.
          DIGIT='0123456789'
          ALNUM="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz${DIGIT}"
          NUM="[${DIGIT}]+"
          RELEASE="${NUM}(\.${NUM})*"
          CLAUSE="((==|!=)${RELEASE}(\.\*)?|~=${NUM}(\.${NUM})+|(<=|>=|<|>)${RELEASE})"
          SPECIFIER_RE="^${CLAUSE}(,${CLAUSE})*$"
          EXACT_PREFIX_RE="^${NUM}\.${NUM}\.${NUM}"
          EXACT_RE="${EXACT_PREFIX_RE}$"
          REF_RE="^[${ALNUM}._/-]+$"
          if [[ -z "$PHANTOM_VERSION" ]]; then
            reject "Value is empty."
          elif [[ "$PHANTOM_VERSION" == -* ]]; then
            reject "Value must not start with '-'."
          elif [[ "$PHANTOM_VERSION" == *">"* || "$PHANTOM_VERSION" == *"<"* || "$PHANTOM_VERSION" == *"="* ]]; then
            [[ "$PHANTOM_VERSION" =~ $SPECIFIER_RE ]] || reject "Not a valid version specifier."
            TARGET="phantom-docs${AI_EXTRA}${PHANTOM_VERSION}"
          elif [[ "$PHANTOM_VERSION" =~ $EXACT_PREFIX_RE ]]; then
            [[ "$PHANTOM_VERSION" =~ $EXACT_RE ]] || reject "Not a valid exact version (expected N.N.N)."
            TARGET="phantom-docs${AI_EXTRA}==${PHANTOM_VERSION}"
          else
            [[ "$PHANTOM_VERSION" =~ $REF_RE ]] || reject "Git ref contains a character outside A-Z a-z 0-9 . _ / -."
            case "$PHANTOM_VERSION" in
              /* | */ | *//* | *..*) reject "Git ref must not start or end with '/', repeat '/', or contain '..'." ;;
            esac
            TARGET="git+https://github.com/wbuscombe/phantom.git@${PHANTOM_VERSION}${AI_EXTRA}"
          fi
          pip install "$TARGET"
          phantom --version

      # ── Web runner dependencies ──
      - name: Cache Playwright browsers (web)
        if: inputs.project-type == 'web'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Playwright (web)
        if: inputs.project-type == 'web'
        run: playwright install chromium --with-deps

      # ── TUI runner dependencies ──
      - name: Setup Rust toolchain (tui)
        if: inputs.project-type == 'tui'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable (pinned 2026-07-11)

      - name: Cache silicon binary (tui)
        if: inputs.project-type == 'tui' && inputs.rust-cache
        id: silicon-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/silicon
            ~/.cargo/registry
            ~/.cargo/git
          key: silicon-${{ runner.os }}-v0.5.2

      - name: Install silicon system deps (tui)
        if: inputs.project-type == 'tui'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libharfbuzz-dev libfreetype6-dev libexpat1-dev libfontconfig1-dev

      - name: Install silicon (tui)
        if: inputs.project-type == 'tui' && steps.silicon-cache.outputs.cache-hit != 'true'
        run: cargo install silicon --version 0.5.2

      - name: Install JetBrains Mono font (tui)
        if: inputs.project-type == 'tui'
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip -o /tmp/jbmono.zip
          unzip -q /tmp/jbmono.zip -d /tmp/jbmono
          cp /tmp/jbmono/fonts/ttf/*.ttf ~/.local/share/fonts/
          fc-cache -f

      # ── Desktop runner dependencies (SDL, Swing, etc.) ──
      - name: Install desktop deps (xvfb + xdotool + imagemagick)
        if: inputs.project-type == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev

      # ── Install project dependencies ──
      - name: Detect and install project deps
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f package.json ]; then
            npm ci
          elif [ -f Cargo.toml ]; then
            cargo build --release
          fi

      # ── Cache analyst state for incremental CI runs ──
      - name: Cache analyst state
        if: inputs.ai-analyst == true || inputs.ai-auto == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .phantom-state.json
          key: phantom-analyst-state-${{ github.repository }}-${{ github.ref }}
          restore-keys: phantom-analyst-state-${{ github.repository }}-

      # ── Validate & Capture ──
      - name: Validate manifest
        if: inputs.ai-analyst != true && inputs.ai-auto != true
        run: phantom validate .phantom.yml

      - name: Run captures
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-key }}
          PHANTOM_MODE: "1"
        run: |
          # --fail-on-quality-error makes this step exit non-zero on an
          # error-severity capture, which fails the job and skips the
          # success-gated commit/push steps below (fail-closed). force-publish
          # passes --force to override the gate for intentionally low-signal frames.
          FLAGS="--project . --skip-publish --fail-on-quality-error"
          if [[ "${{ inputs.force-publish }}" == "true" ]]; then
            FLAGS="$FLAGS --force"
          fi
          if [[ "${{ inputs.ai-auto }}" == "true" ]]; then
            FLAGS="$FLAGS --ai-auto"
          else
            if [[ "${{ inputs.ai-analyst }}" == "true" ]]; then
              FLAGS="$FLAGS --ai-analyst"
            fi
            if [[ "${{ inputs.ai-document }}" == "true" ]]; then
              FLAGS="$FLAGS --ai-document"
            fi
          fi
          phantom run $FLAGS

      # ── Upload artifacts (opt-in, success-only) ──
      # Captured frames are committed by the publish steps below; the artifact
      # is only useful for debugging. It is gated on success() AND an explicit
      # opt-in so a sensitive/failed frame is never made externally downloadable
      # before a human reviews it (artifacts are world-readable on public repos).
      - name: Upload screenshots
        if: success() && inputs.upload-screenshots-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom-screenshots
          path: docs/screenshots/
          if-no-files-found: warn

      # ── Publish: direct commit ──
      # success() gates the commit on the capture/quality step passing: a
      # fail-on-quality-error exit skips this step so no bad frame is committed.
      - name: Publish (direct)
        if: success() && inputs.publish-strategy == 'direct'
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          git config user.name "Phantom Bot"
          git config user.email "phantom@noreply"
          git add docs/screenshots/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(screenshots): update via Phantom [skip ci]"
            git push
          fi

      # ── Publish: PR ──
      - name: Publish (pr)
        if: success() && inputs.publish-strategy == 'pr'
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
        run: |
          BRANCH="phantom/update-screenshots-$(date +%s)"
          git config user.name "Phantom Bot"
          git config user.email "phantom@noreply"
          git checkout -b "$BRANCH"
          git add docs/screenshots/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs(screenshots): update via Phantom"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Update screenshots via Phantom" \
            --body "$(cat <<'EOF'
          ## Summary
          - Updated screenshots captured by Phantom
          - Auto-generated from `.phantom.yml` manifest

          ## Preview
          Check the `docs/screenshots/` directory for updated images.

          🤖 Generated by [Phantom](https://github.com/wbuscombe/phantom)
          EOF
          )"
