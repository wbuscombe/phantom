name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src/phantom/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      - name: Install optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant
      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short
      - name: Contract tests
        run: pytest tests/contract/ -v --tb=short
      - name: Integration tests (darkroom + publisher)
        run: pytest tests/integration/ -v --tb=short --ignore=tests/integration/test_web_runner.py
      - name: Integration tests (web runner)
        run: pytest tests/integration/test_web_runner.py -v --tb=short
      - name: E2E tests
        run: pytest tests/e2e/ -v --tb=short --ignore-glob='*/__init__.py' || true
        if: hashFiles('tests/e2e/test_*.py') != ''
