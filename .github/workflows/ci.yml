name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/
      - name: Mypy
        run: mypy src/phantom/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      - name: Install optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant
      - name: Unit tests
        run: pytest tests/unit/ -v --tb=short
      - name: Contract tests
        run: pytest tests/contract/ -v --tb=short
      - name: Integration tests (darkroom + publisher)
        run: pytest tests/integration/ -v --tb=short --ignore=tests/integration/test_web_runner.py
      - name: Integration tests (web runner)
        run: pytest tests/integration/test_web_runner.py -v --tb=short
      - name: E2E tests
        run: pytest tests/e2e/ -v --tb=short --ignore-glob='*/__init__.py' || true
        if: hashFiles('tests/e2e/test_*.py') != ''

  workflow-static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout: read this repository's workflow files so they can be scanned
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Pinned: an unpinned linter changes what this gate means without a commit.
      # To update, bump the versions on the next line and review the finding delta it produces.
      - name: Install pinned analysis tooling
        run: pip install zizmor==1.30.1 actionlint-py==1.7.12.24
      # With no token, zizmor drops to offline mode, where it cannot query ref provenance
      # and so cannot see the impostor-commit class at all. It exits 0 in that state, so an
      # unguarded gate would report a clean, authoritative-looking pass while blind. Fail closed.
      - name: Require a GitHub token for online scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::No GitHub token available: zizmor would silently scan offline and miss provenance-dependent findings."
            exit 1
          fi
      # Reports every severity. Medium and below stay visible here without failing the build,
      # so they cannot rot unseen. Still exits non-zero if the scan itself fails.
      - name: Report all workflow findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-exit-codes .github/workflows/
      # The gate proper: High and above fail the job.
      - name: Fail on High findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity high .github/workflows/
      # No arguments: actionlint discovers every workflow file itself, so a newly added
      # workflow is in scope automatically.
      - name: Lint workflow syntax
        run: actionlint
