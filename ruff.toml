target-version = "py312"
line-length = 100
src = ["src"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[lint.isort]
known-first-party = ["phantom"]

[format]
quote-style = "double"
indent-style = "space"
