<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Docker Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px;
            background: #1a1a2e;
            color: #eee;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #e94560;
            font-size: 2rem;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 24px;
            margin-top: 20px;
        }
        .status {
            display: inline-block;
            background: #0f3460;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Phantom Docker Test</h1>
        <p>This page is served by nginx inside a Docker container.</p>
        <div class="card" id="test-card">
            <h2>Test Card</h2>
            <p>Used for integration testing of the Docker runner.</p>
            <span class="status">Running</span>
        </div>
    </div>
</body>
</html>
