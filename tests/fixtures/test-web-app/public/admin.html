<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }
        @media (prefers-color-scheme: light) {
            body { background: #f5f5f5; color: #333; }
        }
        header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
        }
        main { padding: 16px; }
        .admin-card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <header><h1>Admin Panel</h1></header>
    <main>
        <div class="admin-card"><h3>Users</h3><p>3 active users</p></div>
        <div class="admin-card"><h3>Devices</h3><p>5 registered devices</p></div>
        <div class="admin-card"><h3>Sessions</h3><p>2 active sessions</p></div>
    </main>
</body>
</html>
