<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }
        @media (prefers-color-scheme: light) {
            body { background: #f5f5f5; color: #333; }
            .section { background: #fff; border-color: #ddd; }
            header { background: #fff; border-color: #ddd; }
        }
        header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #0f3460;
        }
        header h1 { font-size: 20px; }
        main { padding: 24px; max-width: 800px; }
        .section {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .section h2 { font-size: 18px; margin-bottom: 12px; }
        .section p { font-size: 14px; color: #888; margin-bottom: 16px; }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #0f3460;
        }
        .form-row:last-child { border-bottom: none; }
        .toggle {
            width: 44px; height: 24px;
            background: #333;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
        }
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 2px; left: 2px;
        }
        .toggle.on { background: #4ecca3; }
        .toggle.on::after { left: 22px; }
        #advanced-settings { margin-top: 400px; }
    </style>
</head>
<body>
    <header>
        <h1>Settings</h1>
    </header>
    <main>
        <div class="section">
            <h2>General</h2>
            <div class="form-row">
                <span>Dark Mode</span>
                <div class="toggle on"></div>
            </div>
            <div class="form-row">
                <span>Notifications</span>
                <div class="toggle on"></div>
            </div>
            <div class="form-row">
                <span>Auto-connect</span>
                <div class="toggle"></div>
            </div>
        </div>
        <div class="section" id="advanced-settings">
            <h2>Advanced Settings</h2>
            <p>These settings are for advanced users.</p>
            <div class="form-row">
                <span>Debug Mode</span>
                <div class="toggle"></div>
            </div>
            <div class="form-row">
                <span>Verbose Logging</span>
                <div class="toggle"></div>
            </div>
            <div class="form-row">
                <span>Experimental Features</span>
                <div class="toggle"></div>
            </div>
        </div>
    </main>
</body>
</html>
