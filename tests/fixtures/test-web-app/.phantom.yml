phantom: "1"
project: "test-web-app"
name: "Test Web App"
description: "Integration test fixture for Phantom web runner."

setup:
  type: web
  run:
    command: "python server.py --port 9753"
    ready_check:
      type: http
      url: "http://localhost:9753"
      timeout: 10
      interval: 1

fixtures:
  - name: "Seed test data"
    type: http
    method: POST
    url: "http://localhost:9753/api/seed"
    headers:
      Content-Type: "application/json"
    body: '{"test": true}'
    expected_status: 201

capture_defaults:
  viewport: { width: 1280, height: 800 }
  theme: dark
  device_scale: 2
  timeout: 10
  retry:
    max_attempts: 2
    backoff_ms: 500

captures:
  - id: dashboard
    name: "Dashboard"
    route: "/dashboard"
    wait_for: ".device-card"
    output: "docs/screenshots/dashboard.png"

  - id: detail-view
    name: "Detail View"
    route: "/dashboard"
    output: "docs/screenshots/detail.png"
    actions:
      - { type: click, selector: '[data-device="living-room"]' }
      - { type: wait_for, selector: ".detail-panel.visible", timeout: 5 }
      - { type: wait, ms: 300 }

  - id: settings
    name: "Settings"
    route: "/settings"
    output: "docs/screenshots/settings.png"
    actions:
      - { type: scroll_to, selector: "#advanced-settings" }

  - id: mobile-admin
    name: "Mobile Admin"
    route: "/admin"
    viewport: { width: 390, height: 844 }
    output: "docs/screenshots/mobile-admin.png"

  - id: search-typed
    name: "Search with Input"
    route: "/dashboard"
    output: "docs/screenshots/search.png"
    actions:
      - { type: click, selector: "#search-input" }
      - { type: type, text: "living room", delay: 30 }

processing:
  format: png
  border:
    style: none

publishing:
  branch: main
  strategy: direct
