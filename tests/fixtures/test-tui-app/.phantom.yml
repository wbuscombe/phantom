phantom: "1"
project: "test-tui-app"
name: "Test TUI App"
description: "Integration test fixture for Phantom terminal runner."

setup:
  type: tui
  run:
    command: "python3 app.py"
    ready_check:
      type: stdout_match
      pattern: "Ready"
      timeout: 10
      interval: 1

tui:
  terminal:
    width: 80
    height: 24
  renderer: silicon
  renderer_config:
    font: "JetBrains Mono"
    font_size: 14
    theme: "Dracula"
    padding: 20
    background: "#282a36"
    window_controls: true
    corner_radius: 8

capture_defaults:
  viewport: { width: 1280, height: 800 }
  theme: dark
  device_scale: 2
  timeout: 10
  wait_after_actions: 300
  retry:
    max_attempts: 1
    backoff_ms: 500

captures:
  - id: main-view
    name: "Main View"
    output: "docs/screenshots/main.png"

  - id: navigate-down
    name: "Navigate Down"
    output: "docs/screenshots/navigate.png"
    actions:
      - { type: keystroke, key: "j" }
      - { type: keystroke, key: "j" }
      - { type: wait, ms: 200 }

  - id: search-mode
    name: "Search Mode"
    output: "docs/screenshots/search.png"
    actions:
      - { type: keystroke, key: "/" }
      - { type: type_text, text: "settings", delay: 50 }
      - { type: wait, ms: 300 }

  - id: select-item
    name: "Select Item"
    output: "docs/screenshots/selected.png"
    actions:
      - { type: keystroke, key: "enter" }
      - { type: wait, ms: 200 }

processing:
  format: png
  border:
    style: none

publishing:
  branch: main
  strategy: direct
