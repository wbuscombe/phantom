phantom: "1"
project: "circular"
name: "Circular Deps"

setup:
  type: web
  run:
    command: "npm run dev"
    ready_check:
      type: http
      url: "http://localhost:3000"
      timeout: 10

captures:
  - id: alpha
    name: "Alpha"
    output: "docs/alpha.png"
    depends_on: beta

  - id: beta
    name: "Beta"
    output: "docs/beta.png"
    depends_on: alpha
